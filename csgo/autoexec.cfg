sensitivity 2.0
zoom_sensitivity_ratio_mouse 1.0
m_rawinput 1
con_enable 1

bind c "slot6"
bind v "slot10"
bind x "slot8"
bind z "slot7"

bind MWHEELDOWN "+jump"
bind F11 "exec autoexec; mp_restartgame 1"
bind p "sv_pausable 1; pause"

cl_crosshair_drawoutline 0
cl_crosshair_outlinethickness 1
cl_crosshairalpha 255
cl_crosshaircolor 5
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 180
cl_crosshairdot 0
cl_crosshairgap -3
cl_crosshairsize 1.5
cl_crosshairstyle 4
cl_crosshairthickness 0.5
cl_crosshairusealpha 1

viewmodel_fov 68
viewmodel_offset_x 2
viewmodel_offset_y 1.5
viewmodel_offset_z -1.5
viewmodel_presetpos 0
viewmodel_recoil 0
cl_righthand 1

cl_radar_always_centered 1
cl_radar_scale 0.25
cl_hud_background_alpha 0.5
cl_hud_radar_scale 1
hud_scaling 0.85

snd_musicvolume 0
snd_menumusic_volume 0
snd_deathcamera_volume 0
snd_dzmusic_volume 0
snd_mapobjective_volume 0
snd_mvp_volume 0
snd_roundend_volume 0
snd_roundstart_volume 0
snd_tensecondwarning_volume 0

bot_defer_to_human_goals 0
bot_allow_rogues 1
bot_chatter off
bot_all_weapons 0
bot_allow_rifles 1
bot_allow_pistols 1
bot_allow_snipers 1
bot_allow_machine_guns 0
bot_allow_sub_machine_guns 0
bot_allow_shotguns 0
bot_allow_grenades 0

sv_bot_buy_grenade_chance 0
ammo_grenade_limit_total 0
mp_autoteambalance 0
mp_limitteams 0

host_writeconfig
